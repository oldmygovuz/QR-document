<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электрон ҳужжатни текшириш | my.gov.uz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }
    .logo-container {
      margin-bottom: 20px;
    }
    .logo-badge {
      display: inline-block;
      background: #0052cc;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      padding: 8px 18px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    h2 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a202c;
    }
    p.subtitle {
      font-size: 13.5px;
      color: #718096;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 18px;
      letter-spacing: 4px;
      text-align: center;
      font-weight: 600;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0052cc;
      box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
    }
    .btn {
      width: 100%;
      height: 48px;
      background-color: #0052cc;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: #0043a8;
    }
    .btn:active {
      transform: scale(0.99);
    }
    .error-msg {
      display: none;
      color: #e53e3e;
      font-size: 13px;
      margin-top: 10px;
      font-weight: 500;
    }
    .success-msg {
      display: none;
      color: #38a169;
      font-size: 13px;
      margin-top: 10px;
      font-weight: 500;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #a0aec0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <div class="logo-badge">my.gov.uz</div>
    </div>
    <h2>Ҳужжатни текшириш ва юклаш</h2>
    <p class="subtitle">Ҳужжат нусхасида кўрсатилган 4 хонали хавфсизлик кодини киритинг</p>

    <div class="input-group">
      <label for="code">Текшириш коди (PIN):</label>
      <input type="text" id="code" maxlength="4" placeholder="••••" autocomplete="off" inputmode="numeric">
      <div id="error" class="error-msg">Код нотўғри киритилди! Қайта уриниб кўринг.</div>
      <div id="success" class="success-msg">Код тўғри! Ҳужжат юкланмоқда...</div>
    </div>

    <button class="btn" onclick="verifyAndOpen()">
      Ҳужжатни кўриш / Юклаш
    </button>

    <div class="footer">
      Ягона интерактив давлат хизматлари портали тасдиқлаш тизими
    </div>
  </div>

  <script>
    const CORRECT_CODE = "3082";
    const TARGET_FILE = "./hujjat.pdf";

    const input = document.getElementById('code');
    input.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        verifyAndOpen();
      }
    });

    function verifyAndOpen() {
      const enteredCode = input.value.trim();
      const errorDiv = document.getElementById('error');
      const successDiv = document.getElementById('success');

      if (enteredCode === CORRECT_CODE) {
        errorDiv.style.display = 'none';
        successDiv.style.display = 'block';
        setTimeout(() => {
          window.location.href = TARGET_FILE;
        }, 500);
      } else {
        successDiv.style.display = 'none';
        errorDiv.style.display = 'block';
        input.focus();
        input.select();
      }
    }
  </script>
</body>
</html>
